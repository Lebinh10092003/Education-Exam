khaothi.fermat.vn {
    encode zstd gzip

    handle /api/* {
        reverse_proxy khaothi-backend:8000
    }

    handle /admin/* {
        reverse_proxy khaothi-backend:8000
    }

    # MCP cho tro ly AI (xac thuc bang ma truy cap ca nhan trong header Authorization).
    handle /mcp* {
        reverse_proxy khaothi-mcp:8765 {
            flush_interval -1
        }
    }

    handle /ws/* {
        reverse_proxy khaothi-backend:8000
    }

    handle /rtc* {
        reverse_proxy khaothi-livekit:7880
    }

    handle /twirp* {
        reverse_proxy khaothi-livekit:7880
    }

    handle /static/* {
        reverse_proxy khaothi-frontend:80
    }

    handle /media/* {
        reverse_proxy khaothi-frontend:80
    }

    handle {
        reverse_proxy khaothi-frontend:80
    }
}
