[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eduexam-mcp"
version = "0.1.0"
description = "MCP server cho he thong thi EduExam: import/kiem tra cau hoi, kiem tra de, cham tu luan hang loat."
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.2,<2",
  "httpx>=0.27,<1",
  "uvicorn>=0.30,<0.35",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
eduexam-mcp = "eduexam_mcp.server:main"

[tool.setuptools.packages.find]
include = ["eduexam_mcp*"]
