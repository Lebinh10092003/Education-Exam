name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            mcp-server/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e backend -e "mcp-server[test]"
      - name: Backend tests
        working-directory: backend
        run: python -m pytest -q
      - name: MCP tests
        working-directory: mcp-server
        run: python -m pytest -q
      - name: Migrations are up to date
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: python manage.py makemigrations --check --dry-run

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  deploy-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: for f in deploy/*.sh; do bash -n "$f"; done
      - name: Compose file is valid
        run: |
          cp deploy/.env.production.example deploy/.env.production
          sed -i -E 's/^(SECRET_KEY|POSTGRES_PASSWORD|PROCTORING_MEDIA_API_KEY|PROCTORING_MEDIA_API_SECRET|PROCTORING_EVIDENCE_S3_ACCESS_KEY_ID|PROCTORING_EVIDENCE_S3_SECRET_ACCESS_KEY)=$/\1=ci/' deploy/.env.production
          docker network create examedu_default
          docker compose -p khaothi --env-file deploy/.env.production -f deploy/docker-compose.prod.yml config --quiet
