components:
  schemas:
    AuditActor:
      type: object
      properties:
        id:
          type: integer
          nullable: true
        email:
          type: string
        full_name:
          type: string
      required:
      - email
      - full_name
      - id
    AuditEvent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        actor:
          allOf:
          - $ref: '#/components/schemas/AuditActor'
          readOnly: true
        actor_email:
          type: string
          format: email
          readOnly: true
        actor_name:
          type: string
          readOnly: true
        action:
          type: string
          readOnly: true
        category:
          type: string
          readOnly: true
        severity:
          allOf:
          - $ref: '#/components/schemas/AuditEventSeverityEnum'
          readOnly: true
        description:
          type: string
          readOnly: true
        metadata:
          readOnly: true
        request_id:
          type: string
          readOnly: true
        ip_address:
          type: string
          readOnly: true
          nullable: true
        occurred_at:
          type: string
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor
      - actor_email
      - actor_name
      - category
      - created_at
      - description
      - id
      - ip_address
      - metadata
      - occurred_at
      - request_id
      - severity
      - updated_at
    AuditEventSeverityEnum:
      enum:
      - info
      - warning
      - error
      type: string
      description: |-
        * `info` - Info
        * `warning` - Warning
        * `error` - Error
    AuditEventSummary:
      type: object
      properties:
        total_events:
          type: integer
        warning_events:
          type: integer
        error_events:
          type: integer
        today_events:
          type: integer
      required:
      - error_events
      - today_events
      - total_events
      - warning_events
    BlankEnum:
      enum:
      - ''
    CandidateAssignedExam:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        description:
          type: string
        status:
          $ref: '#/components/schemas/ExamStatusEnum'
        duration_minutes:
          type: integer
          maximum: 2147483647
          minimum: 0
        passing_score:
          type: integer
          maximum: 2147483647
          minimum: 0
        max_attempts:
          type: integer
          maximum: 2147483647
          minimum: 0
        subject:
          allOf:
          - $ref: '#/components/schemas/CandidateExamSubject'
          readOnly: true
        schedule:
          allOf:
          - $ref: '#/components/schemas/CandidateExamSchedule'
          readOnly: true
        attempts_used:
