openapi: 3.0.3
info:
  title: EduExam API
  version: 0.1.0
  description: Django API for the EduExam online examination platform.
paths:
  /api/schema/:
    get:
      operationId: api_schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - en
          - vi
      tags:
      - api
      security:
      - apiTokenAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/api-tokens/:
    get:
      operationId: api_v1_api_tokens_list
      description: Ma truy cap MCP cua CHINH tai khoan dang dang nhap (khong xem/thu
        hoi duoc ma cua nguoi khac).
      tags:
      - api
      security:
      - apiTokenAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiToken'
          description: ''
    post:
      operationId: api_v1_api_tokens_create
      description: Ma truy cap MCP cua CHINH tai khoan dang dang nhap (khong xem/thu
        hoi duoc ma cua nguoi khac).
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiToken'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApiToken'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApiToken'
        required: true
      security:
      - apiTokenAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiToken'
          description: ''
  /api/v1/api-tokens/{id}/:
    delete:
      operationId: api_v1_api_tokens_destroy
      description: Ma truy cap MCP cua CHINH tai khoan dang dang nhap (khong xem/thu
        hoi duoc ma cua nguoi khac).
      parameters:
