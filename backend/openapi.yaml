components:
  schemas:
    ActionEnum:
      enum:
      - draft
      - approve
      - reject
      - no_penalty
      type: string
      description: |-
        * `draft` - draft
        * `approve` - approve
        * `reject` - reject
        * `no_penalty` - no_penalty
    ApiToken:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        key_prefix:
          type: string
          maxLength: 24
        created_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
        is_active:
          type: boolean
          readOnly: true
      required:
      - created_at
      - id
      - is_active
      - key_prefix
      - name
    AuditActor:
      type: object
      properties:
        id:
          type: integer
          nullable: true
        email:
          type: string
        full_name:
          type: string
      required:
      - email
      - full_name
      - id
    AuditEvent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        actor:
          allOf:
          - $ref: '#/components/schemas/AuditActor'
          readOnly: true
        actor_email:
          type: string
          format: email
          readOnly: true
        actor_name:
          type: string
          readOnly: true
        action:
          type: string
          readOnly: true
        category:
          type: string
          readOnly: true
        severity:
          allOf:
          - $ref: '#/components/schemas/AuditEventSeverityEnum'
          readOnly: true
        description:
          type: string
          readOnly: true
        metadata:
          readOnly: true
        request_id:
          type: string
          readOnly: true
        ip_address:
          type: string
          readOnly: true
          nullable: true
        occurred_at:
          type: string
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor
      - actor_email
      - actor_name
      - category
      - created_at
      - description
      - id
      - ip_address
      - metadata
      - occurred_at
      - request_id
      - severity
      - updated_at
    AuditEventSeverityEnum:
      enum:
      - info
      - warning
      - error
      type: string
      description: |-
        * `info` - Info
        * `warning` - Warning
        * `error` - Error
    AuditEventSummary:
      type: object
      properties:
        total_events:
          type: integer
        warning_events:
          type: integer
        error_events:
          type: integer
        today_events:
          type: integer
      required:
      - error_events
      - today_events
      - total_events
      - warning_events
    BlankEnum:
      enum:
      - ''
    BulkPenaltyAction:
      type: object
      properties:
        action:
          $ref: '#/components/schemas/ActionEnum'
        case_ids:
          type: array
          items:
            type: integer
            minimum: 1
        proposed_penalty_percent:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        notes:
          type: string
          default: ''
      required:
      - action
      - case_ids
    BulkPenaltyActionResponse:
      type: object
      properties:
        processed_count:
          type: integer
      required:
      - processed_count
    CandidateAssignedExam:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        description:
          type: string
        status:
          $ref: '#/components/schemas/ExamStatusEnum'
        duration_minutes:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        passing_score:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        max_attempts:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        subject:
          allOf:
          - $ref: '#/components/schemas/CandidateExamSubject'
          readOnly: true
        schedule:
          allOf:
          - $ref: '#/components/schemas/CandidateExamSchedule'
          readOnly: true
        attempts_used:
          type: integer
          readOnly: true
        attempts_remaining:
          type: integer
          readOnly: true
        active_session_id:
          type: integer
          readOnly: true
        question_count:
          type: integer
          readOnly: true
        enable_proctoring:
          type: boolean
          readOnly: true
        lifecycle_phase:
          type: string
          readOnly: true
      required:
      - active_session_id
      - attempts_remaining
      - attempts_used
      - enable_proctoring
      - id
      - lifecycle_phase
      - name
      - question_count
      - schedule
      - subject
    CandidateDashboardOverview:
      type: object
      properties:
        stats:
          $ref: '#/components/schemas/CandidateDashboardStats'
        upcoming_exams:
          type: array
          items:
            $ref: '#/components/schemas/CandidateAssignedExam'
        recent_results:
          type: array
          items:
            $ref: '#/components/schemas/Result'
        pending_results:
          type: array
          items:
            $ref: '#/components/schemas/CandidatePendingResult'
        recent_materials:
          type: array
          items:
            $ref: '#/components/schemas/Material'
      required:
      - pending_results
      - recent_materials
      - recent_results
      - stats
      - upcoming_exams
    CandidateDashboardStats:
      type: object
      properties:
        assigned_exam_count:
          type: integer
        upcoming_exam_count:
          type: integer
        published_result_count:
          type: integer
        pending_result_count:
          type: integer
        average_percentage:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        active_material_count:
          type: integer
      required:
      - active_material_count
      - assigned_exam_count
      - average_percentage
      - pending_result_count
      - published_result_count
      - upcoming_exam_count
    CandidateExamSchedule:
      type: object
      properties:
        opens_at:
          type: string
          format: date-time
          nullable: true
        closes_at:
          type: string
          format: date-time
          nullable: true
      required:
      - closes_at
      - opens_at
    CandidateExamSession:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        exam_id:
          type: integer
          readOnly: true
        exam_name:
          type: string
          readOnly: true
        subject:
          allOf:
          - $ref: '#/components/schemas/CandidateExamSubject'
          readOnly: true
        status:
          $ref: '#/components/schemas/ExamSessionStatusEnum'
        attempt_number:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        started_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        submission_deadline:
          type: string
          format: date-time
          readOnly: true
        submission_grace_seconds:
          type: integer
          readOnly: true
        is_late:
          type: boolean
          readOnly: true
        submitted_at:
          type: string
          format: date-time
          nullable: true
        show_results_immediately:
          type: boolean
          readOnly: true
        enable_proctoring:
          type: boolean
          readOnly: true
        lifecycle_phase:
          type: string
          readOnly: true
        remaining_seconds:
          type: integer
          readOnly: true
        objective_score:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        max_score:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        manual_grading_required:
          type: boolean
        answered_count:
          type: integer
          readOnly: true
        marked_count:
          type: integer
          readOnly: true
        total_questions:
          type: integer
          readOnly: true
        questions:
          type: array
          items:
            $ref: '#/components/schemas/SessionQuestion'
          readOnly: true
      required:
      - answered_count
      - attempt_number
      - enable_proctoring
      - exam_id
      - exam_name
      - expires_at
      - id
      - is_late
      - lifecycle_phase
      - marked_count
      - questions
      - remaining_seconds
      - show_results_immediately
      - started_at
      - subject
      - submission_deadline
      - submission_grace_seconds
      - total_questions
    CandidateExamSubject:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        code:
          type: string
        color:
          type: string
      required:
      - code
      - color
      - id
      - name
    CandidateGroup:
      type: object
