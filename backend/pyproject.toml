[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eduexam-backend"
version = "0.1.0"
description = "Django API backend for EduExam"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.1,<5.2",
  "daphne>=4.1,<4.2",
  "uvicorn[standard]>=0.30,<0.35",
  "djangorestframework>=3.15,<3.16",
  "djangorestframework-simplejwt>=5.3,<5.4",
  "channels>=4.1,<4.2",
  "channels-redis>=4.2,<4.3",
  "celery[redis]>=5.4,<5.5",
  "django-environ>=0.12,<0.13",
  "django-storages[s3]>=1.14,<1.15",
  "drf-spectacular>=0.28,<0.29",
  "boto3>=1.37,<1.38",
  "openpyxl>=3.1,<3.2",
  "psycopg[binary]>=3.2,<3.3",
  "pytest>=8.3,<8.4",
  "pytest-django>=4.9,<5.0",
  "psutil>=5.9,<6.0",
]

[tool.setuptools.packages.find]
include = ["config*", "apps*"]

