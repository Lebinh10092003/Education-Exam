
  <!DOCTYPE html>
  <html lang="vi">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <meta name="description" content="Nền tảng thi và luyện thi trực tuyến FermatTech." />
      <meta name="theme-color" content="#193460" />
      <link rel="icon" type="image/svg+xml" href="/fermat-mark.svg" />
      <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
      <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
      <!-- Be Vietnam Pro: thiet ke cho tieng Viet (dau chong ro rang), than thien voi giao duc. -->
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      />
      <title>FermatTech Competitions</title>
      <script>
        // Auto-reload the page if a dynamically imported module fails to load (due to a new deployment)
        window.addEventListener('error', function (e) {
          if (e.message && e.message.indexOf('dynamically imported module') !== -1) {
            console.warn('Dynamic import failed, reloading page to fetch the latest version...');
            window.location.reload();
          }
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          if (e.reason && e.reason.message && e.reason.message.indexOf('dynamically imported module') !== -1) {
            console.warn('Unhandled dynamic import rejection, reloading page...');
            window.location.reload();
          }
        });
      </script>
    </head>

    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
